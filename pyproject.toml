[project]
name = "codeqa"
version = "0.1.0"
description = "RL-trained efficient code Q&A agent"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "tqdm>=4.66",
  "anthropic>=0.40",
  "openai>=1.50",
  "tinker",
  "tinker-cookbook",
  "tree-sitter<0.26",
  "tree-sitter-language-pack>=0.7",
  "modal>=1.0",
  "matplotlib>=3.11.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["codeqa", "tests", "apps/api/tests"]
norecursedirs = ["fixtures", ".venv", "data", "apps"]
markers = ["live: calls a paid external API; skipped without keys"]
pythonpath = ["."]
